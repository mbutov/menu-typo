name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rofi json-glib libxft libxinerama
      - uses: actions/checkout@v4
      - name: Tests
        run: make test
      - name: rofi plugins
        run: make
      - name: dmenu patch is up to date
        run: |
          git config --global --add safe.directory "$PWD"
          make dmenu-patch
          git diff --exit-code dmenu/
      - name: Patched dmenu
        run: make dmenu
      - name: Install into a staging directory
        run: make DESTDIR=$PWD/stage PREFIX=/usr install && find stage -type f
